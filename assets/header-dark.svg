<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t">
  <title id="t">Ayberk Cerit — Software Engineering student building local-first AI</title>
  <style>
    .mono{font-family:ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace}
    .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
    .cur{animation:blink 1.1s steps(1) infinite}
    .pulse{animation:pulse 3.6s ease-in-out infinite}
    .d1{animation-delay:.6s}.d2{animation-delay:1.2s}.d3{animation-delay:1.8s}.d4{animation-delay:2.4s}
    .flow{stroke-dasharray:6 10;animation:flow 2.4s linear infinite}
    @keyframes blink{50%{opacity:0}}
    @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
    @keyframes flow{to{stroke-dashoffset:-32}}
    @media (prefers-reduced-motion:reduce){.cur,.pulse,.flow{animation:none}}
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#11203a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#5fbea1" stop-opacity=".18"/>
      <stop offset="1" stop-color="#5fbea1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#8aa4c2" fill-opacity=".10"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="18" fill="url(#dots)"/>
  <rect width="1200" height="300" rx="18" fill="url(#glow)"/>
  <rect x=".5" y=".5" width="1199" height="299" rx="17.5" fill="none" stroke="#5fbea1" stroke-opacity=".25"/>

  <!-- left: text -->
  <text x="70" y="92" class="mono" font-size="20" fill="#5fbea1">~ $ whoami<tspan class="cur" fill="#5fbea1"> ▍</tspan></text>
  <text x="68" y="165" class="sans" font-size="64" font-weight="700" fill="#e6edf3" letter-spacing="-1">Ayberk Cerit</text>
  <text x="70" y="208" class="sans" font-size="24" fill="#a9b8ca">Software Engineering student · building <tspan fill="#5fbea1" font-weight="600">local-first AI</tspan></text>
  <text x="70" y="250" class="mono" font-size="15" fill="#6f8399">Rust · Python · TypeScript · Laravel   //   Gümüşhane University, Türkiye</text>

  <!-- right: a tiny on-device network -->
  <g transform="translate(840 50)" stroke-linecap="round">
    <g stroke="#8aa4c2" stroke-opacity=".22" stroke-width="1.4">
      <line x1="0" y1="40" x2="130" y2="10"/><line x1="0" y1="40" x2="130" y2="75"/><line x1="0" y1="40" x2="130" y2="140"/><line x1="0" y1="40" x2="130" y2="200"/>
      <line x1="0" y1="110" x2="130" y2="10"/><line x1="0" y1="110" x2="130" y2="75"/><line x1="0" y1="110" x2="130" y2="140"/><line x1="0" y1="110" x2="130" y2="200"/>
      <line x1="0" y1="180" x2="130" y2="10"/><line x1="0" y1="180" x2="130" y2="75"/><line x1="0" y1="180" x2="130" y2="140"/><line x1="0" y1="180" x2="130" y2="200"/>
      <line x1="130" y1="10" x2="260" y2="70"/><line x1="130" y1="75" x2="260" y2="70"/><line x1="130" y1="140" x2="260" y2="70"/><line x1="130" y1="200" x2="260" y2="70"/>
      <line x1="130" y1="10" x2="260" y2="150"/><line x1="130" y1="75" x2="260" y2="150"/><line x1="130" y1="140" x2="260" y2="150"/><line x1="130" y1="200" x2="260" y2="150"/>
    </g>
    <g stroke="#5fbea1" stroke-width="2" fill="none">
      <path class="flow" d="M0 110 L130 75 L260 70"/>
      <path class="flow d2" d="M0 40 L130 140 L260 150"/>
    </g>
    <g fill="#0b1220" stroke="#5fbea1" stroke-width="2">
      <circle cx="0" cy="40" r="9"/><circle cx="0" cy="110" r="9"/><circle cx="0" cy="180" r="9"/>
      <circle cx="130" cy="10" r="9"/><circle cx="130" cy="75" r="9"/><circle cx="130" cy="140" r="9"/><circle cx="130" cy="200" r="9"/>
      <circle cx="260" cy="70" r="11"/><circle cx="260" cy="150" r="11"/>
    </g>
    <g fill="#5fbea1">
      <circle class="pulse" cx="0" cy="110" r="4.5"/>
      <circle class="pulse d1" cx="130" cy="75" r="4.5"/>
      <circle class="pulse d3" cx="130" cy="140" r="4.5"/>
      <circle class="pulse d2" cx="260" cy="70" r="5.5"/>
      <circle class="pulse d4" cx="260" cy="150" r="5.5"/>
    </g>
    <text x="130" y="240" text-anchor="middle" class="mono" font-size="13" fill="#6f8399">runs on your machine · no cloud</text>
  </g>
</svg>
